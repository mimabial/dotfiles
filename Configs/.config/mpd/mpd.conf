music_directory    "$XDG_MUSIC_DIR"

db_file            "~/.local/state/mpd/database"
log_file           "~/.local/state/mpd/log"
pid_file           "~/.local/state/mpd/pid"
state_file         "~/.local/state/mpd/state"
sticker_file       "~/.local/state/mpd/sticker.sql"
playlist_directory "~/.local/state/mpd/playlists"

bind_to_address    "127.0.0.1"
port               "6600"

audio_output {
    type           "pipewire"
    name           "PipeWire Output"
    enabled        "yes"
}

audio_output {
    type           "pulse"
    name           "PulseAudio Output"
    enabled        "no"
}

# FIFO output for visualizers (cava, etc.)
audio_output {
    type           "fifo"
    name           "FIFO Output"
    path           "/tmp/mpd.fifo"
    format         "44100:16:2"
}

audio_output {
    type           "httpd"
    name           "HTTP Stream"
    encoder        "opus"
    port           "8000"
    bind_to_address "127.0.0.1"
    max_clients    "8"
    enabled        "no"
}

auto_update        "yes"
restore_paused     "yes"
max_output_buffer_size "16384"

filesystem_charset "UTF-8"

max_connections    "10"

input {
    plugin         "curl"
}

resampler {
    plugin         "soxr"
    quality        "very high"
}

[global]
monitor = 0
follow = mouse
enable_posix_regex = true
width = 300
height = (0, 600)
scale = 0
notification_limit = 20
progress_bar = true
progress_bar_height = 10
progress_bar_frame_width = 0
progress_bar_min_width = 125
progress_bar_max_width = 250
progress_bar_corner_radius = 4
indicate_hidden = yes
transparency = 10
separator_height = 2
padding = 8
horizontal_padding = 8
text_icon_padding = 10
separator_color = auto
sort = yes
line_height = 3
markup = full
format = "%s\n%b"
alignment = left
vertical_alignment = center
show_age_threshold = 60
ellipsize = middle
ignore_newline = no
stack_duplicates = true
hide_duplicate_count = false
show_indicators = yes
enable_recursive_icon_lookup = true
icon_position = left
min_icon_size = 32
max_icon_size = 64
sticky_history = yes
history_length = 20
browser = /usr/bin/xdg-open
always_run_script = true
title = Dunst
class = Dunst
ignore_dbusclose = false
force_xwayland = false
force_xinerama = false
mouse_left_click = close_current
mouse_middle_click = do_action
mouse_right_click = close_all

[experimental]
per_monitor_dpi = true

# Keep every notification in the archive behind the bar's notification panel.
# dunst keeps only history_length of them and loses even those when it restarts.
# match_transient drops the OSD popups here; the appname and stack_tag
# exclusions that mirror the history_ignore rules below cannot be expressed as a
# rule (dunst discards an empty `script` rather than letting a later rule clear
# this one, and its regexes are POSIX, with no negative lookahead), so they live
# in notify/archive.sh instead.
[notification_archive]
    summary = ".*"
    match_transient = no
    script = ~/.local/lib/hypr/notify/archive-hook.sh

[transient_history_ignore]
    match_transient = yes
    history_ignore = yes

# Claude Code only notifies to pull attention back to the terminal ("waiting
# for your input", "needs your permission"). Those are prompts, not records,
# so show them but keep them out of history.
[claude_code_history_ignore]
    appname = "Claude Code"
    history_ignore = yes

[codex_app]
appname = "^Codex$"
timeout = 10

[codex_stack]
stack_tag = "^codex$"
timeout = 10

[codex_approval]
stack_tag = "^codex-approval$"
timeout = 30
override_dbus_timeout = 30

[slack]
desktop_entry = "^Slack$"
new_icon = slack

[telegram]
desktop_entry = "^Telegram Desktop$"
new_icon = telegram-desktop

[skype]
desktop_entry = "^Skype$"
new_icon = skype

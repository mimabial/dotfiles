[general]
reaper_freq=5
desiredgov=performance
softrealtime=off
renice=0
ioprio=off
inhibit_screensaver=0
disable_splitlock=0

[filter]
blacklist=/usr/bin/env
    /usr/bin/bash
    /usr/bin/grep
    /usr/bin/readlink
    inspect-library
    /lib/wine/x86_64-windows/
    /lib/wine/i386-windows/
    Install.exe
    install.exe
    Installer.exe
    installer.exe
    Setup.exe
    setup.exe
    Update.exe
    update.exe
    Updater.exe
    updater.exe
    unins000.exe

[custom]
start=/home/rifle/.local/lib/hypr/gaming/gamemode-hook.sh start
end=/home/rifle/.local/lib/hypr/gaming/gamemode-hook.sh end

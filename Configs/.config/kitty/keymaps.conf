#: Kitty modifier key
kitty_mod ctrl+shift

#: Seamless Neovim/Kitty pane navigation
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_VIM=true ctrl+h
map --when-focus-on var:IS_VIM=true ctrl+j
map --when-focus-on var:IS_VIM=true ctrl+k
map --when-focus-on var:IS_VIM=true ctrl+l

#: Search
map kitty_mod+/ launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+colon launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

#: Grab kitten
map kitty_mod+g combine : launch --location=vsplit --cwd=last_reported zsh -ci "lazygit" : goto_layout Stack

# ───────────────────────────────
# TMUX-LIKE KEYMAPS FOR KITTY
# ───────────────────────────────

#: Split panes (tmux: % and ")
map kitty_mod+5 launch --location=vsplit --cwd=last_reported
map kitty_mod+( launch --location=vsplit --cwd=last_reported
map kitty_mod+' launch --location=hsplit --cwd=last_reported

#: Switch panes (tmux: o, arrow keys)
map kitty_mod+o next_window
map kitty_mod+x close_window
map kitty_mod+z toggle_layout stack


#: Resize panes (tmux: kitty_mod++ arrow)
map kitty_mod+left resize_window narrower
map kitty_mod+right resize_window wider
map kitty_mod+up resize_window taller
map kitty_mod+down resize_window shorter

#: Rotate panes (tmux: kitty_mod++ Ctrl+o)

#: Break / detach pane (tmux: !)
map kitty_mod+1 detach_window
map kitty_mod+& detach_window

#: Tab management
map kitty_mod+c launch --type=tab --cwd=last_reported
map kitty_mod+n next_tab
map kitty_mod+p previous_tab
map kitty_mod+, set_tab_title
map --allow-fallback=shifted,ascii kitty_mod+7 close_tab

#: Kill session (tmux: &) — close all tabs
map kitty_mod+q close_os_window

#: Show time (tmux: t) — display time notification
map kitty_mod+t show_text '  '$(date +'%H:%M:%S')

#: Copy mode (tmux: [)
map kitty_mod+[ show_scrollback
map kitty_mod+i show_scrollback

#: Paste buffer (tmux: ])
map kitty_mod+] paste_from_buffer
map kitty_mod+y paste_from_buffer

#: Split-window with command (tmux: :)
map kitty_mod+semicolon launch --type=overlay kitten sh -c "kitty @ help"

#: Detach (no direct equivalent)
map kitty_mod+d detach_tab

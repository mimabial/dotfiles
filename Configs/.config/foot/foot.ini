include=~/.cache/hypr/render/foot/colors.ini
font=IntoneMono Nerd Font:size=15.00
font-size-adjustment=0.833333
line-height=31px
pad=10x4 center
selection-target=both

[scrollback]
lines=10000
multiplier=6

[cursor]
unfocused-style=hollow

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-home=Shift+Home
scrollback-end=Shift+End
search-start=Control+Shift+f

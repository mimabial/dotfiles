# Ported from mahaveergurjar/Hyprlock-Dots layout11.conf

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    #blur_passes = 0
    #contrast = 0.8916
    #brightness = 0.8172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# GREETINGS
label {
    monitor =
    text =Welcome!
    color = rgba($c7.r, $c7.g, $c7.b, 0.75)
    font_size = 55
    font_family = $font
    position = 165, 320
    halign = left
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 0.75)
    font_size = 40
    font_family = $font
    position = 255, 240
    halign = left
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = Sunday, September 29
    color = rgba($c7.r, $c7.g, $c7.b, 0.75)
    font_size = 20
    text_align = left
    font_family = $font
    position = 180, 175
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 1
    border_color = rgba($c4.r, $c4.g, $c4.b, 0.75)
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 249, 25
    halign = left
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba($fg.r, $fg.g, $fg.b, 0.20)
    rounding = -1
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 170, -140
    halign = left
    valign = center
}

# USER
label {
    monitor =
    text =  $USER
    color = rgba($c7.r, $c7.g, $c7.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = $font
    position = 281, -140
    halign = left
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($fg.r, $fg.g, $fg.b, 0.10)
    font_color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <i><span foreground="##$fg.hex" alpha="60%">🔒 Enter Pass</span></i>
    hide_input = false
    position = 170, -220
    halign = left
    valign = center
}

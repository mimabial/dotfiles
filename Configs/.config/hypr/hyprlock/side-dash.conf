# Ported from mahaveergurjar/Hyprlock-Dots layout15.conf
$cover = $MPRIS_IMAGE
$music = $HOME/.local/lib/hypr/session/hyprlock.sh
$battery = hyprshell battery.sh
$weather = $WEATHER
$location = $LOCATION


general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}


# BACKGROUND
background {
    path = $BACKGROUND_PATH
    # color = rgba(255, 0, 0, 0)
    blur_passes = 0

}



# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color =rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 60
    font_family = $font
    position = -60, 400
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 60
    font_family = $font
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 19
    font_family = $font
    position = 0, 340
    halign = center
    valign = center
}



# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 2
    border_color = rgba($tone.c1.65.173.r, $tone.c1.65.173.g, $tone.c1.65.173.b, 0.60)
    size = 190
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = -100, 0
    halign = right
    valign = center
}

 

# USER-BOX
shape {
    monitor =
    size = 200, 50
    color =rgba($tone.c1.65.173.r, $tone.c1.65.173.g, $tone.c1.65.173.b, 0.60)
    rounding = $rounding
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = -100, -250
    halign = right
    valign = center
}

# USER
label {
    monitor =
    text = cmd[update:60000] ( echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 178 50 11 $font
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 11
    position = -110, -250
    halign = right
    valign = center
    font_family = $font
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($tone.c1.65.173.r, $tone.c1.65.173.g, $tone.c1.65.173.b, 0.60)
    font_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    fade_on_empty = false
    placeholder_text = <span size="$ph.175.12.3a33ab5b"><i><span foreground="##$fg.hex" alpha="60%">   Enter passwd</span></i></span>
    hide_input = false
    position = -100, -335
    halign = right
    valign = center
    rounding = $rounding
    font_family = $font
}




# Music blur div
shape {
    monitor =
    size = 340, 140
    color = rgba($tone.c1.65.173.r, $tone.c1.65.173.g, $tone.c1.65.173.b, 0.60)
    rounding = $rounding
    rotate = 0
    position = -30, -50
    halign = right
    valign = top
    zindex = 1
}



# Music album art
image {
    monitor =
    path = $cover
    size = 110
    rounding = $rounding
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = -40 ,-60
    halign = right
    valign = top
    zindex = 5
    border_color = rgba($c7.r, $c7.g, $c7.b, 0.60)
    border_size = 3
}


# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --source)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 304 125 10 $font
    color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    font_size = 10
    font_family = $font
    position = 1570, -65
    halign = left
    valign = top
    zindex = 5
}


# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --title)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 304 95 12 $font ExtraBold
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 12
    font_family = $font ExtraBold
    position = 1570, -95
    halign = left
    valign = top
    zindex = 5
}



# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --artist)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 304 75 10 $font ExtraBold
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 10
    font_family = $font ExtraBold
    position = 1570, -115
    halign = left
    valign = top
    zindex = 5
}

# NAME
label {
    monitor =
    text = cmd[update:0] printf '%s' '⟲' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 34 40 25 $font
    onclick = $music --previous
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 25
    position = -320, -150
    halign = right
    valign = top
    zindex = 5
    font_family = $font
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --status)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 84 42 21 $font
    onclick = $music --play-pause

    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 21
    font_family = $font
    position = -270, -148
    halign = right
    valign = top
    zindex = 5
}

# NAME
label {
    monitor =
    text = cmd[update:0] printf '%s' '»' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 134 50 25 $font
    onclick = $music --next

    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 25
    position = -220, -140
    halign = right
    valign = top
    zindex = 5
    font_family = $font
}


# Battery div
shape {
    monitor =
    size = 140, 80
    color =rgba($tone.c1.65.173.r, $tone.c1.65.173.g, $tone.c1.65.173.b, 0.60)
    # color =rgb(240, 170, 170)
    rounding = $rounding
    rotate = 0
    position = -40, -220
    halign = right
    valign = top
    zindex = 1
}

# Battery
label {
    monitor =
    text = cmd[update:1000] ( echo -e "$($battery)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 106 65 25 $font ExtraBold
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 25
    font_family = $font ExtraBold
    position = -60, -235
    halign = right
    valign = top
    zindex = 5
}

# Weather div
shape {
    monitor =
    size = 140, 80
    color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    # color =rgb(246, 173, 85)
    rounding = $rounding
    rotate = 0
    position = -210, -220
    halign = right
    valign = top
    xray = false
    zindex = 1
}


# WEATHER 
label {
    monitor =
    text = cmd[update:1000] ( echo "$($weather)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 116 70 10 $font ExtraBold
    color = rgba($c8.r, $c8.g, $c8.b, 1.00)
    font_size = 10
    font_family = $font ExtraBold
    position = -220, -230
    halign = right
    valign = top
    zindex = 5
}

# LOCATION 
label {
    monitor =
    text = cmd[update:1000] ( echo "$($location)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 106 40 10 $font ExtraBold
    color = rgba($c8.r, $c8.g, $c8.b, 1.00)
    font_size = 10
    font_family = $font ExtraBold
    position = -230, -260
    halign = right
    valign = top
    zindex = 5
}


# Ported from mahaveergurjar/Hyprlock-Dots layout4.conf
$mpris_art = $MPRIS_IMAGE
$artfile = $MPRIS_BLURRED
$album = $HOME/.local/lib/hypr/session/hyprlock.sh --mpris

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}
#VARIABLES
$fn_splash=echo "$($album || hyprctl splash )"




# Ported from mahaveergurjar/Hyprlock-Dots layout9.conf


# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 2
    border_color = rgba($c4.r, $c4.g, $c4.b, 0.71)
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 170
    halign = center
    valign = center
}

# NAME
label {
    monitor =
    text = $USER
    color = rgba($c7.r, $c7.g, $c7.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 20
    position = 0, 80
    halign = center
    valign = center
    font_family = $font
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 0.80)
    font_size = 60
    position = 0, -20
    halign = center
    valign = center
    font_family = $font
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba($c7.r, $c7.g, $c7.b, 0.80)
    font_size = 19
    font_family = $font Bold
    position = 0, -90
    halign = center
    valign = center
}

# MAin-BOX
shape {
    monitor =
    size = 500, 500
    color = rgba($bg.r, $bg.g, $bg.b, 0.62)
    rounding = 30
    border_size = 0
    border_color = $primary_8_rgba 
    rotate = 0
    xray = false 
    position = 0, -70
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba($fg.r, $fg.g, $fg.b, 0.10)
    rounding = -1
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -190
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba($c7.r, $c7.g, $c7.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    position = 0, -190
    halign = center
    valign = center
    font_family = $font
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($fg.r, $fg.g, $fg.b, 0.10)
    font_color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    check_color = rgba($c2.r, $c2.g, $c2.b, 0.60)
    fail_color = rgba($c1.r, $c1.g, $c1.b, 0.60)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##$fg.hex" alpha="60%">   Enter Pass</span></i>
    hide_input = false
    position = 0, -268
    halign = center
    valign = center
    font_family = $font
}

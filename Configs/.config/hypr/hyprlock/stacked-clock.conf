# Ported from mahaveergurjar/Hyprlock-Dots layout1.conf
$battery = hyprshell battery.sh

$fn_greet=echo "<i> Hi $USER </i>"

general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

background {
    monitor = 
    path = $BACKGROUND_PATH
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba($tone.c4.49.89.r, $tone.c4.49.89.g, $tone.c4.49.89.b, 0.90)
    shadow_size = 3
    shadow_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    shadow_boost = 1.2
    font_size = 150
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.90)
    font_size = 150
    font_family = $font
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba($tone.c4.63.95.r, $tone.c4.63.95.g, $tone.c4.63.95.b, 0.90)
    font_size = 14
    font_family = $font ExtraBold
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 1
    outer_color = rgba($bg.r, $bg.g, $bg.b, 0.00)
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.50)
    font_color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    fade_on_empty = false
    placeholder_text =<span size="$ph.175.12.579d8d9a"><i>Hi $USER</i></span>
    hide_input = false
    position = 0, -220
    halign = center
    valign = center
    zindex = 20
    font_family = $font
}

label {
    monitor =
    text = cmd[update:1000] ( echo -e "$($battery)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 53 34 12 $font ExtraBold
    color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    font_size = 12
    font_family = $font ExtraBold
    position = -30, -510
    halign = right
    valign = center
    zindex = 5
}

shape {
    monitor =
    size = 70, 35
    color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.50) 
    rounding = $rounding
    rotate = 0
    position = 905, 12
    halign = center
    valign = bottom
    zindex = 1
}

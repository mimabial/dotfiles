# Ported from mahaveergurjar/Hyprlock-Dots layout8.conf


background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 1
    blur_size = 1
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    inner_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgba($c3.r, $c3.g, $c3.b, 1.00)
    fail_color = rgba($c1.r, $c1.g, $c1.b, 1.00) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
    font_family = $font
}


label {
    monitor =
    #clock
    #text = cmd[update:1000] echo "$TIME", $LAYOUT[en,ara]
    text = cmd[update:1000] echo "<span foreground='##$c1.hex'>$(date "+%a %b %d %I:%M %p")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 20
    font_family = $font Semibold
    position = -50, 65
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 16
    font_family = $font Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
image {
    monitor =
    path =  $PROFILE_IMAGE
    size = 200 # lesser side if not 1:1 ratio
    rounding = -1 # negative values mean circle
    border_size = 3
    border_color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    rotate = 0 # degrees, counter-clockwise
    # reload_time = -1 # seconds between reloading, 0 to reload with SIGUSR2
#    reload_cmd =  # command to get new path. if empty, old path will be used. don't run "follow" commands like tail -F
    position = 0, 180
    halign = center
    valign = center
}

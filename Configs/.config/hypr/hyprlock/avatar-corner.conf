# Ported from mahaveergurjar/Hyprlock-Dots layout8.conf

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 1
    blur_size = 1
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba($bg.r, $bg.g, $bg.b, 0.60)
    inner_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    font_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span size="$ph.175.12.d0f1a715"><i>Input Password...</i></span>
    hide_input = false
    rounding = -1
    check_color = rgba($tone.c3.68.136.r, $tone.c3.68.136.g, $tone.c3.68.136.b, 0.60)
    fail_color = rgba($tone.c1.55.204.r, $tone.c1.55.204.g, $tone.c1.55.204.b, 0.60)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
    font_family = $font
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##$tone.c1.64.247.hex'>$(date "+%a %b %d %I:%M %p")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 20
    font_family = $font Semibold
    position = -50, 65
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 16
    font_family = $font Semibold
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}
image {
    monitor =
    path =  $PROFILE_IMAGE
    size = 200
    rounding = -1
    border_size = 3
    border_color = rgba($c7.r, $c7.g, $c7.b, 0.60)
    rotate = 0
    position = 0, 180
    halign = center
    valign = center
}

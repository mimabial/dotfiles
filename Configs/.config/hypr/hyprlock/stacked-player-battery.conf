# Ported from mahaveergurjar/Hyprlock-Dots layout3.conf
$mpris_art = $MPRIS_IMAGE
$artfile = $MPRIS_BLURRED
$music = $HOME/.local/lib/hypr/session/hyprlock.sh
$battery = hyprshell battery.sh

# █ █ █▄█ █▀█ █▀█ █   █▀█ █▀▀ █▄▀
# █▀█  █  █▀▀ █▀▄ █▄▄ █▄█ █▄▄ █ █


# GENERAL
general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

# BACKGROUND
background {
    monitor = 
    path = $BACKGROUND_PATH
    # path = screenshot
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

# Background image
image {
    monitor = 
    path = $artfile
    size = 1100 # lesser side if not 1:1 ratio
    rounding = 1 # negative values mean circle
    border_size = 0
    rotate = 0 # degrees, counter-clockwise
    reload_time = 0 # seconds between reloading, 0 to reload with SIGUSR2
    reload_cmd = 
    position = 18, -10
    halign = center
    valign = center
    zindex = 0
}

# TIME HR
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    # color = rgba(255, 255, 255, 1)
    color = $p1_accent_4_rgba
    shadow_size = 3
    shadow_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    shadow_boost = 1.2
    font_size = 150
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    # color = rgba(255, 255, 255, 1)
    color = $primary_3_rgba
    font_size = 150
    font_family = $font
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    # color = rgba(255, 255, 255, 1)
    color = $p3_accent_6_rgba
    font_size = 14
    font_family = $font ExtraBold
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}


# Music blur div
shape {
    monitor =
    size = 440, 110
    color = $primary_7_rgba 
    rounding = 20
    rotate = 0
    position = 30, -310
    halign = center
    valign = center
    zindex = 1
}

# Music Album Art
image {
    monitor =
    path = $mpris_art
    size = 80
    rounding = 5
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = -130, -310
    halign = center
    valign = center
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 12
    font_family = $font ExtraBold
    position = 880, -310
    halign = left
    valign = center
    zindex = 5
}

# PLAYER LENGTH
label {
    monitor =
    text = cmd[update:1000] $music --length
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 11
    font_family = $font
    position = -730, -332
    halign = right
    valign = center
    zindex = 5
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)"
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 14
    font_family = $font
    position = -730, -310
    halign = right
    valign = center
    zindex = 5
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --source)"
    color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    font_size = 10
    font_family = $font
    position = 880, -280
    halign = left
    valign = center
    zindex = 5
}

# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 10
    font_family = $font ExtraBold
    position = 880, -330
    halign = left
    valign = center
    zindex = 5
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    outer_color = $primary_8_rgba 
    dots_size = 0.1 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 1 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    inner_color = $primary_7_rgba 
    font_color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    fade_on_empty = true
    placeholder_text = <i>Use Me ;) </i>
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    zindex = 20
    font_family = $font
}

# Battery
label {
    monitor =
    text = cmd[update:1000] echo -e "$($battery)"
    color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    font_size = 12
    font_family = $font ExtraBold
    position = -30, -510
    halign = right
    valign = center
    zindex = 5
}

# Battery div
shape {
    monitor =
    size = 70, 35
    color = $primary_7_rgba 
    rounding = 10
    rotate = 0
    position = 905, 12
    halign = center
    valign = bottom
    zindex = 1
}

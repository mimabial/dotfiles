# Ported from mahaveergurjar/Hyprlock-Dots layout3.conf
$mpris_art = $MPRIS_IMAGE
$artfile = $MPRIS_BLURRED
$music = $HOME/.local/lib/hypr/session/hyprlock.sh
$battery = hyprshell battery.sh

general {
  no_fade_in = true
  grace = 1
  disable_loading_bar = false
  hide_cursor = true
  ignore_empty_input = true
  text_trim = true
}

background {
    monitor = 
    path = $BACKGROUND_PATH
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

image {
    monitor = 
    path = $artfile
    size = 1100
    rounding = $rounding
    border_size = 0
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 18, -10
    halign = center
    valign = center
    zindex = 0
    border_color = rgba($c7.r, $c7.g, $c7.b, 0.60)
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%H")"
    color = rgba($tone.c4.49.89.r, $tone.c4.49.89.g, $tone.c4.49.89.b, 0.90)
    shadow_size = 3
    shadow_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    shadow_boost = 1.2
    font_size = 150
    font_family = $font
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.90)
    font_size = 150
    font_family = $font
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%d %b %A")"
    color = rgba($tone.c4.63.95.r, $tone.c4.63.95.g, $tone.c4.63.95.b, 0.90)
    font_size = 14
    font_family = $font ExtraBold
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}

shape {
    monitor =
    size = 440, 110
    color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.50) 
    rounding = $rounding
    rotate = 0
    position = 30, -310
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $mpris_art
    size = 80
    rounding = $rounding
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = -130, -310
    halign = center
    valign = center
    zindex = 5
    border_color = rgba($c7.r, $c7.g, $c7.b, 0.60)
    border_size = 3
}

label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --title)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 314 110 12 $font ExtraBold
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 12
    font_family = $font ExtraBold
    position = 880, -310
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] ( $music --length ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 404 66 11 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 11
    font_family = $font
    position = -730, -332
    halign = right
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --status)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 404 110 14 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 14
    font_family = $font
    position = -730, -310
    halign = right
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --source)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 314 50 10 $font
    color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    font_size = 10
    font_family = $font
    position = 880, -280
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --artist)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 314 70 10 $font ExtraBold
    color = rgba($fg.r, $fg.g, $fg.b, 0.80)
    font_size = 10
    font_family = $font ExtraBold
    position = 880, -330
    halign = left
    valign = center
    zindex = 5
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    outer_color = rgba($tone.c5.72.135.r, $tone.c5.72.135.g, $tone.c5.72.135.b, 0.50) 
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    inner_color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.50) 
    font_color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    fade_on_empty = true
    placeholder_text = <span size="$ph.220.15.55db71c2"><i>Input Password...</i></span>
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    zindex = 20
    font_family = $font
}

label {
    monitor =
    text = cmd[update:1000] ( echo -e "$($battery)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 53 34 12 $font ExtraBold
    color = rgba($c7.r, $c7.g, $c7.b, 0.50)
    font_size = 12
    font_family = $font ExtraBold
    position = -30, -510
    halign = right
    valign = center
    zindex = 5
}

shape {
    monitor =
    size = 70, 35
    color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.50) 
    rounding = $rounding
    rotate = 0
    position = 905, 12
    halign = center
    valign = bottom
    zindex = 1
}

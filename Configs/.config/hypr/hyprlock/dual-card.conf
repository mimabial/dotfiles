# Ported from mahaveergurjar/Hyprlock-Dots layout20.conf
$music = $HOME/.local/lib/hypr/session/hyprlock.sh


# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 2
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

# --- LEFT COLUMN ---

# LOGIN CARD
shape {
    monitor =
    size = 360, 380
    color = rgba($bg.r, $bg.g, $bg.b, 0.30)
    rounding = $rounding
    border_size = 0
    position = -200, 160
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] ( hostname ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 100 14 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 14
    font_family = $font
    position = -200, 300
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:0] printf '%s' 'Log in' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 220 42 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 42
    font_family = $font
    position = -200, 240
    halign = center
    valign = center
    zindex = 2
}

# Username Display 
shape {
    monitor =
    size = 320, 70
    color = rgba($tone.c1.54.161.r, $tone.c1.54.161.g, $tone.c1.54.161.b, 0.60)
    rounding = $rounding
    position = -200, 130
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:0] printf '%s' 'username' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 68 30 10 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 10
    font_family = $font
    position = -310, 150
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:1000] ( echo "<b>$USER</b>" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 108 40 18 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 18
    font_family = $font
    position = -290, 115
    halign = center
    valign = center
    zindex = 3
}

# Password Input
label {
    monitor =
    text = cmd[update:0] printf '%s' 'password' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 68 30 10 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 10
    font_family = $font
    position = -310, 60
    halign = center
    valign = center
    zindex = 3
}

input-field {
    monitor =
    size = 320, 70
    outline_thickness = 0
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = false
    outer_color = rgba($bg.r, $bg.g, $bg.b, 0.00)
    inner_color = rgba($tone.c1.54.161.r, $tone.c1.54.161.g, $tone.c1.54.161.b, 0.60)
    font_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    fade_on_empty = false
    placeholder_text = 
    hide_input = false
    rounding = $rounding
    position = -200, 40
    halign = center
    valign = center
    zindex = 2
    font_family = $font
}

# CLOCK CARD
shape {
    monitor =
    size = 360, 160
    color = rgba($bg.r, $bg.g, $bg.b, 0.30)
    rounding = $rounding
    position = -200, -140
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] ( date +"<b>%H:%M</b>" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 130 72 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 72
    font_family = $font
    position = -200, -125
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] ( uptime -p | sed -e 's/up /  UPTIME /' -e 's/ hours, /H/' -e 's/ minutes/M/' -e 's/ hour, /H/' -e 's/ minute/M/' ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 208 50 14 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 14
    font_family = $font
    position = -260, -195
    halign = center
    valign = center
    zindex = 2
}


# --- RIGHT COLUMN ---

# PROFILE CARD (Blurred)
shape {
    monitor =
    size = 360, 380
    color = rgba($bg.r, $bg.g, $bg.b, 0.30)
    rounding = $rounding
    position = 200, 160
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $PROFILE_IMAGE
    size = 120
    rounding = $rounding
    border_size = 3
    border_color = rgba($tone.c1.54.161.r, $tone.c1.54.161.g, $tone.c1.54.161.b, 0.60)
    position = 200, 260
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] ( echo "<b>$(date +"%a" | tr '[:lower:]' '[:upper:]')</b>" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 360 38 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 38
    font_family = $font
    position = 200, 150
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = cmd[update:1000] ( date +"%d %B, %Y" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 260 14 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 14
    font_family = $font
    position = 200, 100
    halign = center
    valign = center
    zindex = 11
}

# SYSTEM/MEDIA STATUS CARD
shape {
    monitor =
    size = 360, 320
    color = rgba($bg.r, $bg.g, $bg.b, 0.60)
    rounding = $rounding
    position = 200, -140
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba($bg.r, $bg.g, $bg.b, 0.50)
    zindex = 10
}

# Media Info
label {
    monitor =
    text = cmd[update:1000] ( icon="$($music --source)"; echo " ${icon:-󰎆} " ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 60 18 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 18
    font_family = $font
    position = 200, -10
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] ( title=$(playerctl metadata xesam:title 2>/dev/null | cut -c1-24); if [ -z "$title" ]; then echo "No Music Playing"; else echo "$title"; fi ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 120 14 $font
    color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    font_size = 14
    font_family = $font
    position = 200, -40
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text = cmd[update:1000] ( artist=$(playerctl metadata xesam:artist 2>/dev/null | cut -c1-30); if [ -z "$artist" ]; then echo ""; else echo "$artist"; fi ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 328 160 12 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 12
    font_family = $font
    position = 200, -60
    halign = center
    valign = center
    zindex = 11
}

# Connectivity Buttons
shape {
    monitor =
    size = 150, 75
    color = rgba($tone.c1.75.72.r, $tone.c1.75.72.g, $tone.c1.75.72.b, 0.60)
    rounding = $rounding
    position = 115, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  cmd[update:0] printf '%s' '<b> </b>' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 120 55 18 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 18
    font_family = $font
    position = 115, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] ( wifi=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | awk -F: '$1=="yes"{print $2}' | head -n 1 | cut -c1-14); if [ -z "$wifi" ]; then echo "Disconnected"; else echo "$wifi"; fi ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 120 45 10 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 10
    font_family = $font
    position = 115, -145
    halign = center
    valign = center
    zindex = 12
}

shape {
    monitor =
    size = 150, 75
    color = rgba($tone.c1.75.72.r, $tone.c1.75.72.g, $tone.c1.75.72.b, 0.60)
    rounding = $rounding
    position = 285, -130
    halign = center
    valign = center
    zindex = 11
}

label {
    monitor =
    text =  cmd[update:0] printf '%s' '<b> </b>' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 120 55 18 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 18
    font_family = $font
    position = 285, -120
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] ( bt=$(bluetoothctl info 2>/dev/null | grep "Name:" | cut -d ' ' -f 2- | cut -c 1-14); if [ -z "$bt" ]; then echo "Disconnected"; else echo "$bt"; fi ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 120 45 10 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 10
    font_family = $font
    position = 285, -145
    halign = center
    valign = center
    zindex = 12
}

# Battery Bar
shape {
    monitor =
    size = 320, 100
    color = rgba($tone.c1.54.161.r, $tone.c1.54.161.g, $tone.c1.54.161.b, 0.60)
    rounding = $rounding
    position = 200, -235
    halign = center
    valign = center
    zindex = 11
}

# Battery Inner icon block
shape {
    monitor =
    size = 100, 20
    color = rgba($bg.r, $bg.g, $bg.b, 0.60)
    rounding = $rounding
    position = 200, -205
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] ( status=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); if [ "$status" = "Discharging" ]; then echo " <b>!</b> "; else echo " <b>󰚥</b> "; fi ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 90 20 12 $font
    color = rgba($tone.c1.54.161.r, $tone.c1.54.161.g, $tone.c1.54.161.b, 1.00)
    font_size = 12
    font_family = $font
    position = 200, -205
    halign = center
    valign = center
    zindex = 13
}

label {
    monitor =
    text = cmd[update:1000] ( cat /sys/class/power_supply/BAT0/capacity | sed 's/.*/<b>&%<\/b>/' ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 288 100 24 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 24
    font_family = $font
    position = 200, -235
    halign = center
    valign = center
    zindex = 12
}

label {
    monitor =
    text = cmd[update:1000] ( cat /sys/class/power_supply/BAT0/status ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 288 40 10 $font
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 10
    font_family = $font
    position = 200, -265
    halign = center
    valign = center
    zindex = 12
}

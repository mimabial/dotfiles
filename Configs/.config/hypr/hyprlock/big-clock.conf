# Ported from mahaveergurjar/Hyprlock-Dots layout6.conf

$fn_splash=echo "$(hyprctl splash)"

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 3
    blur_size = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $TIME
    color = rgba($tone.c5.72.135.r, $tone.c5.72.135.g, $tone.c5.72.135.b, 0.90)
    font_size = 200 
    font_family = $font ExtraBold
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d %Y")"   
    color = rgba($tone.c4.63.95.r, $tone.c4.63.95.g, $tone.c4.63.95.b, 0.90)
    font_size = 40
    font_family = $font ExtraBold
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A")"   
    color = rgba($tone.c4.49.89.r, $tone.c4.49.89.g, $tone.c4.49.89.b, 0.90)
    font_size = 40
    font_family = $font ExtraBold
    position = 550, 180
    halign = center
    valign = center
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

$fn_greet=echo "Good $(date +%H | awk '{if ($1 < 10) print "morning"; else if ($1 < 13) print "noon"; else if ($1 < 18) print "afternoon"; else if ($1 < 22) print "evening"; else print "night"}'), $(echo ${USER} | tr '[:lower:]' '[:upper:]')"

label {
    monitor =
    text = cmd[update:60000] $fn_greet 
    color = rgba($tone.c4.73.98.r, $tone.c4.73.98.g, $tone.c4.73.98.b, 0.90)
    font_size = 30
    font_family = $font
    position = 0, -400
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba($tone.c5.72.135.r, $tone.c5.72.135.g, $tone.c5.72.135.b, 0.60)
    inner_color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.60)
    font_color = rgba($fg.r, $fg.g, $fg.b, 0.90)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span size="$ph.175.12.7382fa37"><i>  Logged in as </i>$USER</span>
    hide_input = false
    rounding = -1
    fail_color = rgba($tone.c1.55.204.r, $tone.c1.55.204.g, $tone.c1.55.204.b, 0.60)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = 1
    numlock_color = 1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, -130
    halign = center
    valign = center
    font_family = $font
}

label {
    monitor = 
    text = cmd[update:1000] $fn_splash
    color = rgba($tone.c5.78.125.r, $tone.c5.78.125.g, $tone.c5.78.125.b, 0.90)
    font_family = $font, Font Awesome 6 Free Solid
    position = 0, 0
    halign = center
    valign = bottom
}


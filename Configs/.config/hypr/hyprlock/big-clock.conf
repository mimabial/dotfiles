# Ported from mahaveergurjar/Hyprlock-Dots layout6.conf

#variables
$fn_splash=echo "$(hyprctl splash)"

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    # path = screenshot
    blur_passes = 3 # 0 disables blurring
    blur_size = 2
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    # text = cmd[update:1000] echo "$(date +"%-I:%M%p")"
    #text = cmd[update:1000] echo "$(date +"%H:%M")"
    text = $TIME
    color = rgba($tone.c5.72.135.r, $tone.c5.72.135.g, $tone.c5.72.135.b, 0.90)
    font_size = 200 
    font_family = $font ExtraBold
    position = 0, 300
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d %Y")"   
    color = rgba($tone.c4.63.95.r, $tone.c4.63.95.g, $tone.c4.63.95.b, 0.90)
    font_size = 40
    font_family = $font ExtraBold
    position = 0, 50
    halign = center
    valign = center
}

# DAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A")"   
    color = rgba($tone.c4.49.89.r, $tone.c4.49.89.g, $tone.c4.49.89.b, 0.90)
    font_size = 40
    font_family = $font ExtraBold
    position = 550, 180
    halign = center
    valign = center
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

$fn_greet=echo "Good $(date +%H | awk '{if ($1 < 10) print "morning"; else if ($1 < 13) print "noon"; else if ($1 < 18) print "afternoon"; else if ($1 < 22) print "evening"; else print "night"}'), $(echo ${USER} | tr '[:lower:]' '[:upper:]')"

# USER
label {
    monitor =
    #text = cmd[update:60000] echo "Good $(date +"%-I" | awk '{if ($1 < 12) print "morning"; else print "evening"}') $(echo ${USER} | tr '[:lower:]' '[:upper:]' )"
    text = cmd[update:60000] $fn_greet 
    color = rgba($tone.c4.73.98.r, $tone.c4.73.98.g, $tone.c4.73.98.b, 0.90)
    font_size = 30
    font_family = $font
    position = 0, -400
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba($tone.c5.72.135.r, $tone.c5.72.135.g, $tone.c5.72.135.b, 0.60)
    inner_color = rgba($tone.c4.59.137.r, $tone.c4.59.137.g, $tone.c4.59.137.b, 0.60)
    font_color = rgba($fg.r, $fg.g, $fg.b, 0.90)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <span size="$ph.175.12.7382fa37"><i>  Logged in as </i>$USER</span>
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    fail_color = rgba($tone.c1.55.204.r, $tone.c1.55.204.g, $tone.c1.55.204.b, 0.60) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = 1
    numlock_color = 1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = true # see below
    position = 0, -130
    halign = center
    valign = center
    font_family = $font
}


# SPLASH
label {
    monitor = 
    text = cmd[update:1000] $fn_splash
    color = rgba($tone.c5.78.125.r, $tone.c5.78.125.g, $tone.c5.78.125.b, 0.90)
    font_family = $font, Font Awesome 6 Free Solid
    position = 0, 0
    halign = center
    valign = bottom
}


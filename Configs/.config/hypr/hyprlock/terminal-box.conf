# Mirrors the ly login screen (/etc/ly/config.ini): black canvas, white single
# border, no title, no clock, ly's row labels and asterisk-masked password.

general {
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.00)
}

shape {
    monitor =
    size = 528, 130
    color = rgba(0, 0, 0, 0.00)
    rounding = 0
    border_size = 1
    border_color = rgba(255, 255, 255, 1.00)
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] printf '%s' 'wayland'
    color = rgba(255, 255, 255, 1.00)
    font_size = 14
    font_family = $font
    position = -204, 26
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] printf '%s' "$XDG_SESSION_DESKTOP"
    color = rgba(255, 255, 255, 1.00)
    font_size = 14
    font_family = $font
    position = -88, 26
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] printf '%s' 'login'
    color = rgba(255, 255, 255, 1.00)
    font_size = 14
    font_family = $font
    position = -214, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 1.00)
    font_size = 14
    font_family = $font
    position = -104, 0
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] printf '%s' 'password'
    color = rgba(255, 255, 255, 1.00)
    font_size = 14
    font_family = $font
    position = -198, -26
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 374, 26
    outline_thickness = 0
    dots_size = 0.8
    dots_spacing = 0.15
    dots_center = false
    dots_text_format = *
    outer_color = rgba(0, 0, 0, 0.00)
    inner_color = rgba(0, 0, 0, 0.00)
    font_color = rgba(255, 255, 255, 1.00)
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    fail_text = authentication error
    hide_input = false
    rounding = 0
    position = 55, -26
    halign = center
    valign = center
}

# Ported from mahaveergurjar/Hyprlock-Dots layout18.conf
$cover = $MPRIS_IMAGE
$music = $HOME/.local/lib/hypr/session/hyprlock.sh


general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}


# BACKGROUND
background {
    path = $BACKGROUND_PATH
    # color = rgba(255, 0, 0, 0)
    blur_passes = 0

}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color =rgba($c3.r, $c3.g, $c3.b, 1.00)
    font_size = 60
    font_family = $font
    position = -60, 400
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 60
    font_family = $font
    position = 45, 400
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 19
    font_family = $font
    position = 0, 340
    halign = center
    valign = center
}



# INPUT FIELD
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($c3.r, $c3.g, $c3.b, 1.00)
    font_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    fade_on_empty = true
    placeholder_text = <i><span foreground="##$fg.hex" alpha="60%">   Enter passwd</span></i>
    hide_input = false
    position = 0, -460
    halign = center
    valign = center
    rounding = 15
    font_family = $font
}

# USER-BOX
shape {
    monitor =
    size = 200, 50
    color = rgba($c3.r, $c3.g, $c3.b, 1.00)
    rounding = 15
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -460
    halign = center
    valign = center
}

# USER
label {
    monitor =
    # text = <i> Hi! $USER ;) </i>
    text = cmd[update:60000] echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" 
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 11
    position = 0, -460
    halign = center
    valign = center
    font_family = $font
}

# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 2
    border_color = rgba($c1.r, $c1.g, $c1.b, 1.00) 
    size = 220
    rounding = 35
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
}

# MAIN-BOX
shape {
    monitor =
    size = 500, 500
    color = rgba($c3.r, $c3.g, $c3.b, 1.00)
    rounding = 25
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 1.00)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
}


# Music album art
image {
    monitor =
    path = $cover
    size = 220
    rounding = 35
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] echo "$($music --title)"
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    font_size = 15
    font_family = $font ExtraBold
    position = 0, -50
    halign = center
    valign = center
    zindex = 5
}

# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] echo "$($music --artist)"
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    font_size = 12
    font_family = $font ExtraBold
    position = 0, -90
    halign = center
    valign = center
    zindex = 5
}

# heart icon
label {
    monitor =
    text = 
    onclick = playerctl -p spotify previous
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = -110, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

# Step Backward
label {
    monitor =
    text = 
    onclick = playerctl -p spotify previous
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = -60, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

# PLAYER STATUS
label {
    monitor =
    text = cmd[update:1000] echo "$($music --status)"
    onclick = playerctl -p spotify play-pause
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 21
    position = 0, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

# Step Forward
label {
    monitor =
    text = 
    onclick = playerctl -p spotify next
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = 60, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}
# Plus icon
label {
    monitor =
    text = 󰐙
    onclick = playerctl -p spotify next
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = 110, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

# MUSIC PROGRESS
label {
    monitor =
    text = cmd[update:1000]  $HOME/.local/lib/hypr/session/hyprlock.progress.sh $c2.hex $fg.hex
    font_size = 16
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    position = 0, -200
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}


# Music Visualizer Label
label {
    # 50ms update rate (cmd[update:50]) for fluid animation
    text = cmd[update:50] cat $XDG_RUNTIME_DIR/hypr/hyprlock-cava.txt 2>/dev/null
    font_family = $font
    font_size = 7
    halign = center
    valign = center
    position = 0, -294
    markup = true
    zindex = 5
}

# Feeds the visualizer: $PPID is hyprlock to the shell it spawns; the feeder exits with it.
label {
    text = cmd[update:0] $HOME/.local/lib/hypr/session/hyprlock.cava.py $PPID $c3.hex >/dev/null 2>&1 &
}

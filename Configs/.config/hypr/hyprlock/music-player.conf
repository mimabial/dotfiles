# Ported from mahaveergurjar/Hyprlock-Dots layout18.conf
$cover = $MPRIS_IMAGE
$music = $HOME/.local/lib/hypr/session/hyprlock.sh

general {
    immediate_render = true
    no_fade_in = true
    no_fade_out = true
    disable_loading_bar = false
    hide_cursor = false
    transparent = true
}

background {
    path = $BACKGROUND_PATH
    blur_passes = 0

}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    color =rgba($tone.c3.87.89.r, $tone.c3.87.89.g, $tone.c3.87.89.b, 1.00)
    font_size = 60
    font_family = $font
    position = -60, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 60
    font_family = $font
    position = 45, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 19
    font_family = $font
    position = 0, 340
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($tone.c3.77.59.r, $tone.c3.77.59.g, $tone.c3.77.59.b, 0.60)
    font_color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    fade_on_empty = true
    placeholder_text = <span size="$ph.175.12.3a33ab5b"><i><span foreground="##$fg.hex" alpha="60%">   Enter passwd</span></i></span>
    hide_input = false
    position = 0, -460
    halign = center
    valign = center
    rounding = $rounding
    font_family = $font
}

shape {
    monitor =
    size = 200, 50
    color = rgba($tone.c3.77.59.r, $tone.c3.77.59.g, $tone.c3.77.59.b, 0.60)
    rounding = $rounding
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    rotate = 0
    xray = false
    position = 0, -460
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ( echo "<i> Good $(H=$(date +%H); if [ $H -lt 12 ]; then echo Morning; elif [ $H -lt 18 ]; then echo Afternoon; else echo Evening; fi) $(echo "${USER:0:1}" | tr '[:lower:]' '[:upper:]')$(echo "${USER:1}" | tr '[:upper:]' '[:lower:]') </i>" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 175 50 11 $font
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 11
    position = 0, -460
    halign = center
    valign = center
    font_family = $font
}

image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 2
    border_color = rgba($tone.c1.50.162.r, $tone.c1.50.162.g, $tone.c1.50.162.b, 0.60) 
    size = 220
    rounding = $rounding
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 500, 500
    color = rgba($tone.c3.77.59.r, $tone.c3.77.59.g, $tone.c3.77.59.b, 0.60)
    rounding = $rounding
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    rotate = 0
    xray = false
    position = 0, -100
    halign = center
    valign = center
    zindex = 0
}

image {
    monitor =
    path = $cover
    size = 220
    rounding = $rounding
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 0, 90
    halign = center
    valign = center
    zindex = 1
    zindex = 5
    border_color = rgba($c7.r, $c7.g, $c7.b, 0.60)
    border_size = 3
}

label {
    monitor =
    text = cmd[update:1000] ( $music --title ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 468 400 15 $font ExtraBold
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    font_size = 15
    font_family = $font ExtraBold
    position = 0, -50
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] ( $music --artist ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 468 480 12 $font ExtraBold
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    font_size = 12
    font_family = $font ExtraBold
    position = 0, -90
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:0] printf '%s' '' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 248 400 25 $font
    onclick = $music --rewind
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = -110, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

label {
    monitor =
    text = cmd[update:0] printf '%s' '' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 348 400 25 $font
    onclick = $music --previous
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = -60, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

label {
    monitor =
    text = cmd[update:1000] ( $music --status ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 468 400 21 $font
    onclick = $music --play-pause
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 21
    position = 0, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

label {
    monitor =
    text = cmd[update:0] printf '%s' '' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 348 400 25 $font
    onclick = $music --next
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = 60, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}
label {
    monitor =
    text = cmd[update:0] printf '%s' '' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 248 400 25 $font
    onclick = $music --forward
    color = rgba($bg.r, $bg.g, $bg.b, 1.00)
    font_size = 25
    position = 110, -150
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

label {
    monitor =
    text = cmd[update:1000] ( $HOME/.local/lib/hypr/session/hyprlock.progress.sh $c2.hex $fg.hex ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 468 300 16 $font
    font_size = 16
    color = rgba($bg.r, $bg.g, $bg.b, 0.80)
    position = 0, -200
    halign = center
    valign = center
    zindex = 5
    font_family = $font
}

label {
    text = cmd[update:50] cat $XDG_RUNTIME_DIR/hypr/hyprlock-cava.txt 2>/dev/null
    font_family = $font
    font_size = 7
    halign = center
    valign = center
    position = 0, -294
    markup = true
    zindex = 5
}

label {
    text = cmd[update:0] $HOME/.local/lib/hypr/session/hyprlock.cava.py $PPID $c3.hex 488 7 $font >/dev/null 2>&1 &
}

# Ported from mahaveergurjar/Hyprlock-Dots layout12.conf
$mpris_art = $MPRIS_IMAGE
$music = $HOME/.local/lib/hypr/session/hyprlock.sh

# $hyprDir = $HOME/.config/hypr

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    #blur_passes = 0
    #contrast = 0.8916
    #brightness = 0.8172
    #vibrancy = 0.1696
    #vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

# GREETINGS
label {
    monitor =
    text =Welcome!
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 55
    font_family = $font
    position = -630, 320
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 40
    font_family = $font
    position = -630, 240
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = Sunday, September 29
    color = rgba($c7.r, $c7.g, $c7.b, 0.75)
    font_size = 20
    text_align = left
    font_family = $font
    position = 180, 175
    halign = left
    valign = center
}

# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 1
    border_color = rgba($tone.c4.77.111.r, $tone.c4.77.111.g, $tone.c4.77.111.b, 0.60)
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = -630, 25
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 320, 55
    color = rgba($c8.r, $c8.g, $c8.b, 0.40)
    rounding = -1
    border_size = 0
    border_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = -630, -140
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =cmd[update:0] printf '%s' '  $USER' | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 292 55 16 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 16
    font_family = $font
    position =-630, -140
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba($fg.r, $fg.g, $fg.b, 0.00)
    inner_color = rgba($c8.r, $c8.g, $c8.b, 0.40)
    font_color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    fade_on_empty = false
    font_family = $font
    placeholder_text = <span size="$ph.292.13.b39b0cfe"><i><span foreground="##$c7.hex">🔒 Enter Pass</span></i></span>
    hide_input = false
    position = -630, -220
    halign = center
    valign = center
}

# Dragons be here - music widget

# Music blur div
shape {
    monitor =
    size = 350, 110
    color = rgba($c8.r, $c8.g, $c8.b, 0.40)
    rounding = $rounding
    rotate = 0
    position = -630, -350
    halign = center
    valign = center
    zindex = 1
}

# Music Album Art
image {
    monitor =
    path = $mpris_art
    size = 86
	border_size = 3
	border_color = rgba($fg.r, $fg.g, $fg.b, 0.60)
    rounding = $rounding
    rotate = 0
    reload_time = 0
    reload_cmd =
    position = 167, -350
    halign = left
    valign = center
    zindex = 5
}


# PLAYER ARTIST
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --artist)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 219 60 12 $font ExtraBold
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 12
    font_family = $font ExtraBold
    position = 270, -375
    halign = left
    valign = center
    zindex = 5
}

# PLAYER TITLE
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --title)" ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 219 110 14 $font ExtraBold
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 14
    font_family = $font ExtraBold
    position = 270, -350
    halign = left
    valign = center
    zindex = 5
}

# PLAYER SOURCE
label {
    monitor =
    text = cmd[update:1000] ( echo "$($music --source)" & ) | $HOME/.local/lib/hypr/session/hyprlock.fit.sh 219 50 12 $font
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 12
    font_family = $font
    position = 270, -320
    halign = left
    valign = center
    zindex = 5
}

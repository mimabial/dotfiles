# Ported from mahaveergurjar/Hyprlock-Dots layout13.conf
$wall = $BACKGROUND_PATH

# $wall = $HOME/.config/hyprlock/wallpapers/1.jpg

# BACKGROUND
background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}


# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I")</span>"
    
    color = rgba($tone.c1.50.162.r, $tone.c1.50.162.g, $tone.c1.50.162.b, 1.00) 
    font_size = 60
    font_family = $font
    position = -55, 310
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +":%M")</span>"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 60
    font_family = $font
    position = 55, 310
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba($c7.r, $c7.g, $c7.b, 1.00)
    font_size = 19
    font_family = $font
    position = 0, 250
    halign = center
    valign = center
}



# Profie-Photo
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 2
    border_color = rgba($tone.c1.50.162.r, $tone.c1.50.162.g, $tone.c1.50.162.b, 0.60) 
    size = 220
    rounding = $rounding
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, 0
    halign = center
    valign = center
}


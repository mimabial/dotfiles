# "auto" uses IP geolocation only when allowed; otherwise it uses UTC/equator.
# Private location override (~/.local/state/hypr/env-overrides):
#   export AUTO_THEME_LATITUDE="<lat>"
#   export AUTO_THEME_LONGITUDE="<lon>"
#   export AUTO_THEME_TIMEZONE="<tz>"
allow_auto_geolocation = false
latitude = auto
longitude = auto
timezone = auto

# Watchdog fallback; event-driven wakeups are primary.
check_interval_seconds = 60

# Minutes after sunrise and before sunset.
sun_offset_minutes = 30

control_hyprland = true

# Minutes before auto-resuming; 0 disables it.
manual_override_duration = 120

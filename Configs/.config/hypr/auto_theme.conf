# Coordinates stay out of this synced file: set AUTO_THEME_LATITUDE, AUTO_THEME_LONGITUDE
# and AUTO_THEME_TIMEZONE in ~/.local/state/hypr/env-overrides instead.
allow_auto_geolocation = false
latitude = auto
longitude = auto
timezone = auto

watchdog_interval_seconds = 60
daylight_inset_minutes = 30
control_hyprland = true
manual_override_minutes = 120

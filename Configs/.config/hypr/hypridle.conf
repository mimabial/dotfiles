$LOCK_CMD = hyprshell lock-screen.sh
$UNLOCK_CMD = sh -c 'pkill -9 $(hyprshell lock-screen --get)'

general {
    lock_cmd = $LOCK_CMD
    unlock_cmd = $UNLOCK_CMD
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    before_sleep_cmd = hyprshell session/lid-close.sh --no-suspend
    after_sleep_cmd = hyprshell gaming/gamemode-hook reconcile
}

listener {
    timeout = 60
    on-timeout = hyprshell controls/brightness-idle.sh dim
    on-resume = hyprshell controls/brightness-idle.sh restore
}

# Locks the session before DPMS off, so the screen is not visible after wake
listener {
    timeout = 120
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

listener {
    timeout = 500
    on-timeout = hyprshell session/suspend.sh
}

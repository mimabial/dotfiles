set-environment -g "TMUX_PLUGIN_MANAGER_PATH" "$HOME/.local/share/tmux/plugins"

set -g @plugin "tmux-plugins/tpm"
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin "schasse/tmux-jump"
set -g @plugin "fcsonline/tmux-thumbs"
set -g @plugin "jaclu/tmux-menus"
set -g @plugin "olimorris/tmux-pomodoro-plus"
set -g @plugin 'MunifTanjim/tmux-suspend'
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

set -g @resurrect-save-script-path "$HOME/.config/tmux/scripts/tmux-resurrect-save-safe"
set -g @resurrect-restore-script-path "$HOME/.config/tmux/scripts/tmux-resurrect-restore-safe"
set -g @resurrect-restore 'R'

set -g @continuum-boot 'on'
set -g @continuum-restore 'off'
set -g @continuum-save-interval '5'

set -g @suspend_key 'F6'
set -g @suspend_suspended_options " \
  @mode_indicator_custom_prompt:: 󰏤 , \
  @mode_indicator_custom_mode_style::bg=#{@theme_gray}\\,fg=#{@theme_bg}, \
"

set -g @mode_indicator_prefix_prompt "  WAIT "
set -g @mode_indicator_copy_prompt "  COPY "
set -g @mode_indicator_sync_prompt " 󰓦 SYNC "
set -g @mode_indicator_empty_prompt " #S TMUX "
set -g @mode_indicator_prefix_mode_style 'fg=#{@theme_bg},bg=#{@theme_red},italics'
set -g @mode_indicator_copy_mode_style 'fg=#{@theme_bg},bg=#{@theme_yellow},italics'
set -g @mode_indicator_sync_mode_style 'fg=#{@theme_bg},bg=#{@theme_accent},italics'
set -g @mode_indicator_empty_mode_style 'fg=#{@theme_fg},bg=#{@theme_black},bold'

set -g @pomodoro_notifications 'off'
set -g @pomodoro_toggle 'o'
set -g @pomodoro_cancel 'O'
set -g @pomodoro_skip '-'
set -g @pomodoro_mins 25
set -g @pomodoro_break_mins 5
set -g @pomodoro_intervals 4
set -g @pomodoro_long_break_mins 25
set -g @pomodoro_repeat 'off'
set -g @pomodoro_on "#[fg=#{@theme_gray}] "
set -g @pomodoro_complete "#[fg=#{@theme_red}]󱦟 "
set -g @pomodoro_pause "#[fg=#{@theme_green}] "
set -g @pomodoro_prompt_break "#[fg=#{@theme_red}] ??"
set -g @pomodoro_prompt_pomodoro "#[fg=#{@theme_red}] ??"
set -g @pomodoro_show_intervals "#[fg=#{@theme_gray}] [%s/%s]"
set -g @pomodoro_menu_position "R"
set -g @pomodoro_sound 'Pop'
set -g @pomodoro_granularity 'off'

set -g @jump-key "/"

set -g @thumbs-key 'C-f'
set -g @thumbs-unique enabled
set -g @thumbs-contrast 1
set -g @thumbs-hint-fg-color red
set -g @thumbs-command '$HOME/.config/tmux/scripts/tmux-open {}'
set -g @thumbs-upcase-command 'printf %s {} | "$HOME/.config/tmux/scripts/tmux-copy" && tmux display-message "Copied {}"'

unbind-key -n MouseDown3Pane
unbind-key -n M-MouseDown3Pane
unbind-key -n MouseDown3Status
unbind-key -n MouseDown3StatusLeft
unbind-key <
unbind-key >
set -g @menus_trigger "C-m"

if "test ! -d \"$HOME/.local/share/tmux/plugins/tpm\"" \
   "run 'git clone https://github.com/tmux-plugins/tpm \"$HOME/.local/share/tmux/plugins/tpm\" && \"$HOME/.local/share/tmux/plugins/tpm/bin/install_plugins\"'"
run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"
run-shell "$HOME/.config/tmux/scripts/tmux-refresh-status-plugins"
bind C-s run-shell "$HOME/.config/tmux/scripts/tmux-resurrect-save-safe"

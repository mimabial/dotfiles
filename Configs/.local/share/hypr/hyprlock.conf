# The generated `~/.config/hypr/hyprlock.conf` sets `$LAYOUT_PATH` then sources this file.

$BACKGROUND_PATH = $XDG_CACHE_HOME/hypr/wallpaper/current/wall.set.png
$SPLASH_CMD = $HOME/.local/lib/hypr/session/hyprlock.sh --mpris || hyprctl splash
$MPRIS_TITLE = $HOME/.local/lib/hypr/session/hyprlock.sh --title
$MPRIS_ARTIST = $HOME/.local/lib/hypr/session/hyprlock.sh --artist
$MPRIS_SOURCE = $HOME/.local/lib/hypr/session/hyprlock.sh --source
$MPRIS_STATUS = $HOME/.local/lib/hypr/session/hyprlock.sh --status
$MPRIS_LENGTH = $HOME/.local/lib/hypr/session/hyprlock.sh --length
$MPRIS_IMAGE = $XDG_CACHE_HOME/hypr/landing/mpris.png
$MPRIS_BLURRED = $XDG_CACHE_HOME/hypr/landing/mpris.blurred.png
$PROFILE_IMAGE = $XDG_CACHE_HOME/hypr/landing/profile.png
$GREET_TEXT = sh -c 'h=$(date +%H); if [ "$h" -lt 6 ]; then echo "Good Night"; elif [ "$h" -lt 12 ]; then echo "Good Morning"; elif [ "$h" -lt 18 ]; then echo "Good Afternoon"; else echo "Good Evening"; fi'
$WEATHER = $HOME/.local/lib/hypr/util/wttr.sh -i -d -t
$LOCATION = $HOME/.local/lib/hypr/util/wttr.sh -l -c
$BATTERY_ICON = hyprshell sysinfo/battery.sh icon

general{
    fractional_scaling=1
    screencopy_mode=1 # fix screencopy failure on nvidia gpus
}

label {
    text = cmd[update:86400000] hyprshell font.sh resolve "$LAYOUT_PATH"
    position = 0%, 0%
    font_size = 20
    valign = bottom
    halign = left
}

# hyprlang noerror true
source = $LAYOUT_PATH
# hyprlang noerror false

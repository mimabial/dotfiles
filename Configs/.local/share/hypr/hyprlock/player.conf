$SIDEBAR_X = -630
$SIDEBAR_WIDTH = 320
$FIELD_HEIGHT = 55
$PASSWORD_LABEL_Y = -140
$MEDIA_CARD_Y = -350
$MEDIA_ART_X = -729
$MEDIA_TEXT_X = -575
$MEDIA_TEXT_FRAME = 180 110

background {
    monitor =
    path = $BACKGROUND_PATH
}

general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

label {
    monitor =
    text = cmd[update:60000] $GREET_TEXT
    color = $color5
    font_size = 55
    font_family = $font
    position = $SIDEBAR_X, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] $WEATHER
    color = $color5
    font_size = 20
    font_family = $font
    position = $SIDEBAR_X, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0:1] date +"%I:%M"
    color = $foreground
    font_size = 40
    font_family = $font
    position = $SIDEBAR_X, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0:1] date +"%A, %B %d"
    color = $color7
    font_size = 20
    text_align = left
    font_family = $font
    position = 180, 175
    halign = left
    valign = center
}

image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 4
    border_color = $color4
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = $SIDEBAR_X, 25
    halign = center
    valign = center
}

shape {
    monitor =
    size = $SIDEBAR_WIDTH, $FIELD_HEIGHT
    color = $color8_alpha
    rounding = -1
    border_size = 0
    border_color = $foreground
    rotate = 0
    xray = false

    position = $SIDEBAR_X, $PASSWORD_LABEL_Y
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter Pass:
    color = $color7
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 16
    font_family = $font
    position = $SIDEBAR_X, $PASSWORD_LABEL_Y
    halign = center
    valign = center
}

input-field {
    monitor =
    size = $SIDEBAR_WIDTH, $FIELD_HEIGHT
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = $color8_alpha
    font_color = $foreground
    fade_on_empty = false
    font_family = $font
    placeholder_text =
    hide_input = false
    position = $SIDEBAR_X, -220
    halign = center
    valign = center
}

shape {
    monitor =
    size = $SIDEBAR_WIDTH, 110
    color = $color8_alpha
    rounding = 20
    rotate = 0
    position = $SIDEBAR_X, $MEDIA_CARD_Y
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $MPRIS_IMAGE
    size = 86
    border_size = 3
    border_color = $foreground
    rounding = 10
    rotate = 0
    reload_time = 0
    reload_cmd =
    position = $MEDIA_ART_X, $MEDIA_CARD_Y
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:0:1] $MPRIS_ARTIST | $HOME/.local/lib/hypr/session/hyprlock.fit.sh $MEDIA_TEXT_FRAME 12 $font ExtraBold
    color = $color7
    font_size = 12
    font_family = $font ExtraBold
    position = $MEDIA_TEXT_X, -375
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:0:1] $MPRIS_TITLE | $HOME/.local/lib/hypr/session/hyprlock.fit.sh $MEDIA_TEXT_FRAME 14 $font ExtraBold
    color = $foreground
    font_size = 14
    font_family = $font ExtraBold
    position = $MEDIA_TEXT_X, $MEDIA_CARD_Y
    halign = center
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:0:1] $MPRIS_SOURCE
    color = $color6
    font_size = 12
    font_family = $font
    position = $MEDIA_TEXT_X, -320
    halign = center
    valign = center
    zindex = 5
}

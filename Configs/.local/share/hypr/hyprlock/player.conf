$fontFamily = JetBrainsMono Nerd Font
$fn_greet = echo "Hello, ${USER}!"

background {
    monitor =
    path = $BACKGROUND_PATH
}

general {
    no_fade_in = false
    disable_loading_bar = false
    grace = 1
}

label {
    monitor =
    text = cmd[update:60000] $GREET_TEXT
    color = $color5
    font_size = 55
    font_family = JetBrainsMono Nerd Font
    position = -630, 400
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] $WEATHER
    color = $color5
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -630, 320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $foreground
    font_size = 40
    font_family = JetBrainsMono Nerd Font
    position = -630, 240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $color7
    font_size = 20
    text_align = left
    font_family = JetBrainsMono Nerd Font
    position = 180, 175
    halign = left
    valign = center
}

image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 4
    border_color = $color4
    size = 160
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = -630, 25
    halign = center
    valign = center
}

shape {
    monitor =
    size = 320, 55
    color = $color8_alpha
    rounding = -1
    border_size = 0
    border_color = $foreground
    rotate = 0
    xray = false

    position = -630, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter Pass:
    color = $color7
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -630, -140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = $color8_alpha
    font_color = $foreground
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text =
    hide_input = false
    position = -630, -220
    halign = center
    valign = center
}

shape {
    monitor =
    size = 320, 110
    color = $color8_alpha
    rounding = 20
    rotate = 0
    position = -630, -350
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 99, 86
    color = $background_alpha
    rounding = 10
    border_size = 0
    rotate = 0
    position = 185, -350
    halign = left
    valign = center
    zindex = 4
}

image {
    monitor =
    path = $MPRIS_IMAGE
    size = 86
    border_size = 3
    border_color = $foreground
    rounding = 10
    rotate = 0
    reload_time = 0
    reload_cmd =
    position = 185, -350
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_ARTIST
    color = $color7
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 295, -375
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_TITLE
    color = $foreground
    font_size = 14
    font_family = JetBrains Mono Nerd Font Mono ExtraBold
    position = 295, -350
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_SOURCE
    color = $color6
    font_size = 12
    font_family = JetBrains Mono Nerd Font Mono
    position = 295, -320
    halign = left
    valign = center
    zindex = 5
}

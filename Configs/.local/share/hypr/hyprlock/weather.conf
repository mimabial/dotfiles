$clockFont = AlfaSlabOne
$CARD_COLOR = rgba(88, 91, 112, 0.4)
$CARD_ROUNDING = 10
$TEXT_COLOR = rgba(255, 255, 255, 1)
$TEXT_DIM_COLOR = rgba(255, 255, 255, 0.6)
$MEDIA_CARD_Y = -310
$MEDIA_TEXT_X = 860
$MEDIA_CONTROLS_X = -750
$MEDIA_TOP_ROW_Y = -280
$MEDIA_BOTTOM_ROW_Y = -335
$WEATHER_TEXT_X = -20

general {
    no_fade_in = true
    grace = 1
    disable_loading_bar = false
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

background {
    monitor = 
    path = $BACKGROUND_PATH
    blur_passes = 0
    contrast = 0.8916
    brightness = 0.7172
    vibrancy = 0.1696
    vibrancy_darkness = 0
}

label {
    monitor =
    text = cmd[update:1000] date +%H
    border_color = rgba(137, 180, 250, .75)
    color = $color4
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = $clockFont
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] date +%M
    color = rgba($c7.r, $c7.g, $c7.b, .75)
    font_size = 150
    font_family = $clockFont
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] date +"%d %b %A"
    color = $foreground
    font_size = 14
    font_family = $font ExtraBold
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}

shape {
    monitor =
    size = 440, 110
    color = $CARD_COLOR
    rounding = $CARD_ROUNDING
    rotate = 0
    position = 0, $MEDIA_CARD_Y
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor =
    path = $MPRIS_IMAGE
    size = 80
    rounding = 5
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 750, $MEDIA_CARD_Y
    halign = left
    valign = center
    zindex = 5
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_TITLE
    color = $TEXT_COLOR
    max_length = 40
    font_size = 12
    font_family = $font ExtraBold
    position = $MEDIA_TEXT_X, $MEDIA_CARD_Y
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_LENGTH
    color = $TEXT_COLOR
    font_size = 11
    font_family = $font
    position = $MEDIA_CONTROLS_X, $MEDIA_BOTTOM_ROW_Y
    halign = right
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_STATUS
    color = $TEXT_COLOR
    font_size = 14
    font_family = $font
    position = $MEDIA_CONTROLS_X, $MEDIA_TOP_ROW_Y
    halign = right
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:2000] $MPRIS_SOURCE
    color = $TEXT_DIM_COLOR
    font_size = 10
    font_family = $font
    position = $MEDIA_TEXT_X, $MEDIA_TOP_ROW_Y
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] $MPRIS_ARTIST
    color = $TEXT_DIM_COLOR
    font_size = 10
    font_family = $font ExtraBold
    position = $MEDIA_TEXT_X, $MEDIA_BOTTOM_ROW_Y
    halign = left
    valign = center
    zindex = 10
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.1
    dots_spacing = 1
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = $CARD_COLOR
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <span foreground="##bac2de">󰌾 Enter Pass</span>
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    zindex = 20
}

label {
    monitor =
    text = cmd[update:900000] $BATTERY_ICON
    color = rgba(200, 200, 200, 0.5)
    font_size = 12
    font_family = $font ExtraBold
    position = -30, -510
    halign = right
    valign = center
    zindex = 10
}

shape {
    monitor =
    size = 70, 35
    color = $CARD_COLOR
    rounding = $CARD_ROUNDING
    rotate = 0
    position = 905, 12
    halign = center
    valign = bottom
    zindex = 1
}

shape {
    monitor =
    size = 180, 60
    color = $CARD_COLOR
    rounding = $CARD_ROUNDING
    rotate = 0
    position = -10, -20
    halign = right
    valign = top
    xray = false
    zindex = 1
}

label {
    monitor =
    text = cmd[update:86400000] $WEATHER
    color = $TEXT_COLOR
    font_size = 10
    font_family = $font ExtraBold
    position = $WEATHER_TEXT_X, -30
    halign = right
    valign = top
    zindex = 5
}

label {
    monitor =
    text = cmd[update:86400000] $LOCATION
    color = $TEXT_DIM_COLOR
    font_size = 10
    font_family = $font ExtraBold
    position = $WEATHER_TEXT_X, -50
    halign = right
    valign = top
    zindex = 5
}

image {
    monitor = 
    path = $MPRIS_BLURRED
    size = 1100
    rounding = 1
    border_size = 0
    rotate = 0
    reload_time = 0
    reload_cmd = 
    position = 18, -10
    halign = center
    valign = center
    zindex = 0
}

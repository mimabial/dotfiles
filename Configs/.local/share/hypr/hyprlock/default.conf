$fontFamily = JetBrainsMono Nerd Font
$fn_greet = sh -c 'h=$(date +%H); if [ "$h" -lt 12 ]; then p=Morning; elif [ "$h" -lt 18 ]; then p=Afternoon; else p=Evening; fi; echo "Good ${p}, ${USER}"'

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 2
}

label {
  monitor =
  text = $TIME
  color = $foreground
  font_size = 90
  font_family = $fontFamily
  position = -30, 0
  halign = right
  valign = top
}

label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $color7
  font_size = 25
  font_family = $fontFamily
  position = -30, -150
  halign = right
  valign = top
}

image {
    monitor =
    path = $PROFILE_IMAGE
    size = 150
    reload_time = 0
    reload_cmd =
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = $color4
    inner_color = $color0
    font_color = $foreground
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    check_color = $color4
    fail_color = rgba(FF0000FF)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = true
    position = 0, 80
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:60000] $fn_greet
    color = $foreground
    font_size = 20
    font_family = $fontFamily Bold
    position = 0, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] $SPLASH_CMD
    color = $color7
    font_family = $fontFamily
    font_size = 15
    position = 0, 0
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:5000] $BATTERY_ICON
    color = $color6
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = -1%, 1%
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $LAYOUT
    color = $color6
    font_size = 20
    font_family = $fontFamily
    position = -2%, 1%
    halign = right
    valign = bottom
}
